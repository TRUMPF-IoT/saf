name: .NET Core

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  precheck_push_without_pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should_run_build: ${{ steps.open_pr_check.outputs.should_run_build }}
    steps:
      - name: Check for open PR from branch
        id: open_pr_check
        uses: actions/github-script@v7
        with:
          script: |
            const isBranchPush = context.eventName === 'push' && context.ref.startsWith('refs/heads/');
            const isMainPush = context.ref === 'refs/heads/main';

            if (!isBranchPush || isMainPush) {
              core.setOutput('should_run_build', 'true');
              return;
            }

            const branch = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${branch}`;

            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head
            });

            const shouldRunBuild = pulls.length === 0;
            core.setOutput('should_run_build', shouldRunBuild ? 'true' : 'false');

  build_test_pack:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || needs.precheck_push_without_pr.outputs.should_run_build == 'true'
    needs: [precheck_push_without_pr]
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        java-package: jdk

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'
        cache-dependency-path: '.reuse/requirements.txt'
    
    - name: Install REUSE
      run: |
        python -m pip install --upgrade pip
        pip install python-debian==0.1.38
        pip install reuse
        
    - name: REUSE Compliance Check
      run: |
        reuse lint
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'
        cache: true
        cache-dependency-path: 'Directory.Packages.props'

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache dotnet tools
      id: cache-dotnet-tools
      uses: actions/cache@v4
      with:
        path: ~/.dotnet/tools
        key: ${{ runner.os }}-dotnet-tools-${{ hashFiles('./.config/dotnet-tools.json') }}
        restore-keys: ${{ runner.os }}-dotnet-tools-

    - name: Install/upgrade dotnet tools
      shell: powershell
      run: |
        dotnet tool restore

    - name: Run minver
      id: minver
      shell: powershell
      run: |
        $version = dotnet minver
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: nuget restore
      run: dotnet restore './src/SmartApplicationFramework.slnx'
        
    - name: Build, test and analyze
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      shell: powershell
      run: |
        dotnet dotnet-sonarscanner begin /k:"TRUMPF-IoT_saf" /o:"trumpf-iot" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.dotnet.excludeTestProjects=true /d:sonar.exclusions="src/Tests/**,src/PluginSystem/TestPlugins/**,src/Messaging/SAF.Messaging.LoadTest/**" /d:sonar.coverage.exclusions="src/Tests/**,src/PluginSystem/TestPlugins/**,src/Messaging/SAF.Messaging.LoadTest/**" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
        if ( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
        dotnet build './src/SmartApplicationFramework.slnx' --configuration Release --no-restore
        if ( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
        dotnet dotnet-coverage collect -f xml -o coverage.xml 'dotnet test ./src/SmartApplicationFramework.slnx --configuration Release --no-build --no-restore --verbosity normal'
        if ( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
        dotnet dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
        if ( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
      
    - name: Pack
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null
        dotnet pack './src/SmartApplicationFramework.slnx' --configuration Release --no-build --output './artifacts'
        
    - name: Upload artifacts
      if: github.event_name == 'push' && (contains(github.ref, 'refs/tags/') || contains(github.ref, 'refs/heads/main'))
      uses: actions/upload-artifact@v4
      with:
        name: SmartApplicationFramework-${{ steps.minver.outputs.version }}
        path: ./artifacts
      
    - name: Publish nuget packages
      env:
        SAF_NUGETORG_APIKEY: ${{ secrets.SAF_NUGETORG_APIKEY }}
      if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
      run: |
        dotnet nuget push ".\artifacts\*.nupkg" --api-key "$env:SAF_NUGETORG_APIKEY" --source https://api.nuget.org/v3/index.json --skip-duplicate