name: .NET Core

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  precheck_push_without_pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should_run_build: ${{ steps.open_pr_check.outputs.should_run_build }}
    steps:
      - name: Check for open PR from branch
        id: open_pr_check
        uses: actions/github-script@v9
        with:
          script: |
            const isBranchPush = context.eventName === 'push' && context.ref.startsWith('refs/heads/');
            const isMainPush = context.ref === 'refs/heads/main';

            if (!isBranchPush || isMainPush) {
              core.setOutput('should_run_build', 'true');
              return;
            }

            const branch = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${branch}`;

            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head
            });

            const shouldRunBuild = pulls.length === 0;
            core.setOutput('should_run_build', shouldRunBuild ? 'true' : 'false');

  build_test_pack:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || needs.precheck_push_without_pr.outputs.should_run_build == 'true'
    needs: [precheck_push_without_pr]
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        java-package: jdk

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
        cache: 'pip'
        cache-dependency-path: '.reuse/requirements.txt'
    
    - name: Install REUSE
      run: |
        python -m pip install --upgrade pip
        pip install python-debian==0.1.38
        pip install reuse
        
    - name: REUSE Compliance Check
      run: |
        reuse lint
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x'
        cache: true
        cache-dependency-path: 'Directory.Packages.props'

    - name: Cache SonarCloud packages
      uses: actions/cache@v6
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache dotnet tools
      id: cache-dotnet-tools
      uses: actions/cache@v6
      with:
        path: ~/.dotnet/tools
        key: ${{ runner.os }}-dotnet-tools-${{ hashFiles('./.config/dotnet-tools.json') }}
        restore-keys: ${{ runner.os }}-dotnet-tools-

    - name: Install/upgrade dotnet tools
      shell: powershell
      run: |
        dotnet tool restore

    - name: Run minver
      id: minver
      shell: powershell
      run: |
        $version = dotnet minver
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: nuget restore
      run: dotnet restore './src/SmartApplicationFramework.slnx'
        
    - name: Build, test and analyze
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      shell: powershell
      run: |
        dotnet dotnet-sonarscanner begin /k:"TRUMPF-IoT_saf" /o:"trumpf-iot" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.dotnet.excludeTestProjects=true /d:sonar.exclusions="src/Tests/**,src/PluginSystem/TestPlugins/**,src/Messaging/SAF.Messaging.LoadTest/**" /d:sonar.coverage.exclusions="src/Tests/**,src/PluginSystem/TestPlugins/**,src/Messaging/SAF.Messaging.LoadTest/**" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
        if ( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
        dotnet build './src/SmartApplicationFramework.slnx' --configuration Release --no-restore
        if ( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
        dotnet dotnet-coverage collect -f xml -o coverage.xml 'dotnet test ./src/SmartApplicationFramework.slnx --configuration Release --no-build --no-restore --verbosity normal'
        if ( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
        dotnet dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
        if ( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
      
    - name: Pack
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null
        dotnet pack './src/SmartApplicationFramework.slnx' --configuration Release --no-build --output './artifacts'
        
    - name: Upload artifacts
      if: github.event_name == 'push' && (contains(github.ref, 'refs/tags/') || contains(github.ref, 'refs/heads/main'))
      uses: actions/upload-artifact@v7
      with:
        name: SmartApplicationFramework-${{ steps.minver.outputs.version }}
        path: ./artifacts
      
    - name: Publish nuget packages
      env:
        SAF_NUGETORG_APIKEY: ${{ secrets.SAF_NUGETORG_APIKEY }}
      if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
      run: |
        dotnet nuget push ".\artifacts\*.nupkg" --api-key "$env:SAF_NUGETORG_APIKEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  authenticode_fixture:
    name: Prepare signtool Authenticode fixture
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || needs.precheck_push_without_pr.outputs.should_run_build == 'true'
    needs: [precheck_push_without_pr]
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x'

    - name: Build assembly fixture
      env:
        FIXTURE_BUILD_DIRECTORY: ${{ github.workspace }}\authenticode-build
      run: dotnet build './src/PluginSystem/SAF.PluginSystem.Hosting.Extensions.Tests/SAF.PluginSystem.Hosting.Extensions.Tests.csproj' --configuration Release --output $env:FIXTURE_BUILD_DIRECTORY

    - name: Sign assembly fixture with signtool
      shell: pwsh
      env:
        INPUT_ASSEMBLY: ${{ github.workspace }}\authenticode-build\SAF.PluginSystem.Hosting.Extensions.Tests.dll
        OUTPUT_DIRECTORY: ${{ github.workspace }}\signed-authenticode
      run: .\src\PluginSystem\SAF.PluginSystem.Hosting.Extensions.Tests\Authenticode\Sign-AuthenticodeTestAssembly.ps1 -InputAssembly $env:INPUT_ASSEMBLY -OutputDirectory $env:OUTPUT_DIRECTORY

    - name: Upload signed assembly fixture
      uses: actions/upload-artifact@v7
      with:
        name: authenticode-signed-fixture
        path: signed-authenticode

  authenticode_integration:
    name: Authenticode integration (${{ matrix.os }})
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || needs.precheck_push_without_pr.outputs.should_run_build == 'true'
    needs: [precheck_push_without_pr, authenticode_fixture]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x'

    - name: Download signed assembly fixture
      uses: actions/download-artifact@v8
      with:
        name: authenticode-signed-fixture
        path: signed-authenticode

    - name: Verify signed assembly fixture
      shell: pwsh
      env:
        SIGNED_ASSEMBLY: ${{ github.workspace }}/signed-authenticode/SAF.Authenticode.SignedFixture.dll
      run: |
        if (-not (Test-Path -LiteralPath $env:SIGNED_ASSEMBLY -PathType Leaf)) { throw "Signed assembly fixture was not found: $env:SIGNED_ASSEMBLY" }
        $certificatePath = [IO.Path]::ChangeExtension($env:SIGNED_ASSEMBLY, '.cer')
        if (-not (Test-Path -LiteralPath $certificatePath -PathType Leaf)) { throw "Signer certificate fixture was not found: $certificatePath" }

    - name: Run Authenticode integration tests
      env:
        SAF_AUTHENTICODE_SIGNED_ASSEMBLY: ${{ github.workspace }}/signed-authenticode/SAF.Authenticode.SignedFixture.dll
      run: dotnet test './src/PluginSystem/SAF.PluginSystem.Hosting.Extensions.Tests/SAF.PluginSystem.Hosting.Extensions.Tests.csproj' --configuration Release --filter 'FullyQualifiedName~AuthenticodeSignatureReaderIntegrationTests' --verbosity normal

  # Installs the fixture certificate as a trusted root, which is the only way to see the production
  # verifiers reach a trusted verdict on their own: WinVerifyTrust against the Windows root store, and
  # X509Chain against the OpenSSL bundle. It changes machine state, so it runs on its own throwaway
  # runner and never alongside the tests that expect the same fixture to be untrusted.
  authenticode_trusted_root:
    name: Authenticode trusted root (${{ matrix.os }})
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || needs.precheck_push_without_pr.outputs.should_run_build == 'true'
    needs: [precheck_push_without_pr, authenticode_fixture]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x'

    - name: Download signed assembly fixture
      uses: actions/download-artifact@v8
      with:
        name: authenticode-signed-fixture
        path: signed-authenticode

    - name: Trust the fixture certificate (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        FIXTURE_CERTIFICATE: ${{ github.workspace }}/signed-authenticode/SAF.Authenticode.SignedFixture.cer
      run: |
        $certificate = Import-Certificate -FilePath $env:FIXTURE_CERTIFICATE -CertStoreLocation Cert:\LocalMachine\Root
        "SAF_AUTHENTICODE_TEST_ROOT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Trust the fixture certificate (Linux)
      if: runner.os == 'Linux'
      env:
        FIXTURE_CERTIFICATE: ${{ github.workspace }}/signed-authenticode/SAF.Authenticode.SignedFixture.cer
      run: |
        sudo openssl x509 -inform der -in "$FIXTURE_CERTIFICATE" -out /usr/local/share/ca-certificates/saf-authenticode-test.crt
        sudo update-ca-certificates

    - name: Run trusted root integration tests
      env:
        SAF_AUTHENTICODE_SIGNED_ASSEMBLY: ${{ github.workspace }}/signed-authenticode/SAF.Authenticode.SignedFixture.dll
        SAF_AUTHENTICODE_TRUSTED_ROOT: '1'
      run: dotnet test './src/PluginSystem/SAF.PluginSystem.Hosting.Extensions.Tests/SAF.PluginSystem.Hosting.Extensions.Tests.csproj' --configuration Release --filter 'FullyQualifiedName~AuthenticodeTrustedRootIntegrationTests' --verbosity normal

    - name: Remove the fixture certificate (Windows)
      if: always() && runner.os == 'Windows'
      shell: pwsh
      run: |
        if ($env:SAF_AUTHENTICODE_TEST_ROOT_THUMBPRINT)
        {
            Remove-Item -Path "Cert:\LocalMachine\Root\$env:SAF_AUTHENTICODE_TEST_ROOT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
        }

    - name: Remove the fixture certificate (Linux)
      if: always() && runner.os == 'Linux'
      run: |
        sudo rm -f /usr/local/share/ca-certificates/saf-authenticode-test.crt
        sudo update-ca-certificates --fresh
